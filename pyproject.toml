[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-lint"
version = "0.1.0"
description = "Offline, deterministic static linter for Model Context Protocol (MCP) tool definitions — catch tool poisoning, prompt injection, and unsafe capabilities before an agent ever connects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lin Hongyu" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "security", "linter", "prompt-injection", "tool-poisoning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "build"]

[project.scripts]
mcp-lint = "mcp_lint.cli:main"

[project.urls]
Homepage = "https://github.com/linhongyu510/mcp-lint"
Issues = "https://github.com/linhongyu510/mcp-lint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lint"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
