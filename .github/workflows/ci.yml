name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=mcp_lint --cov-report=term-missing
      - name: Self-check (dogfood on the poisoned example, expect non-zero)
        run: |
          if mcp-lint examples/tools_export.json; then
            echo "expected mcp-lint to fail on the poisoned example" && exit 1
          else
            echo "mcp-lint correctly flagged the poisoned example"
          fi
      - name: Self-check (clean example, expect zero)
        run: mcp-lint examples/clean_export.json
